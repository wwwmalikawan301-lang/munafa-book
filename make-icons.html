<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munafa Book icon exporter</title><style>body{font:16px system-ui;padding:20px;max-width:480px;margin:auto}button{min-height:48px;width:100%;margin:8px 0;background:#0B5D4B;color:white;border:0;border-radius:10px}canvas{width:180px;height:180px;display:block;margin:16px auto}</style></head><body><h1>Icon PNG maker</h1><p>Icon SVG ko PNG mein convert kar ke download karein (192x192, 512x512, 512 maskable), phir repo mein upload karein.</p><canvas id="c"></canvas><button onclick="make(192,false)">Download 192 PNG</button><button onclick="make(512,false)">Download 512 PNG</button><button onclick="make(512,true)">Download 512 maskable PNG</button><script>
async function loadSvg(){const r=await fetch('icon.svg');return await r.text()}
async function make(size,mask){const svg=await loadSvg();const blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');if(mask){ctx.fillStyle='#0B5D4B';ctx.fillRect(0,0,size,size)}ctx.drawImage(im,mask?size*.1:0,mask?size*.1:0,size*(mask?.8:1),size*(mask?.8:1));URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=mask?'icon-512-maskable.png':`icon-${size}.png`;a.click()},'image/png')}
</script></body></html>
